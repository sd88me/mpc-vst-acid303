# Build Acid-303 into a DRAFT release (acid303-vst-v<version>) with mpc-vst-plugins' shared workflow:
# Actions -> "VST release (draft)" -> Run workflow. Then install that draft's zip on a device,
# smoke-test it, and publish the draft (see mpc-vst-plugins docs/RELEASING.md).
# dry_run builds the zips and skin previews as run artifacts only.
name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 1.0.0
        required: true
      dry_run:
        description: Build only (zips + skin previews as run artifacts), no draft release
        type: boolean
        default: false

jobs:
  acid303:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@97a2effca4114dd00f738b018e2f0d1d3ccb2d7f
    permissions:
      contents: write
    with:
      tag: acid303-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 97a2effca4114dd00f738b018e2f0d1d3ccb2d7f
      vst_dir: vst
      build: bash vst/build.sh
      host_test: '"$MPC_VST/tools/test_port.sh" vst/vst.json'
      plugin_id: acid-303
      license: AGPL-3.0-only
      about: A TB-303 circuit-model bass synth with switchable Devil Fish mods (voice from Lemus).
      dry_run: ${{ inputs.dry_run }}
